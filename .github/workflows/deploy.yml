name: Deploy DistilBERT to Render

on:
  push:
    branches: [main]
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

# The only 3 lines you need to change:
env:
  # Image to test and deploy (slim-v1 = original UI, slim-v2 = new UI)
  IMAGE: docker.io/03sarath/distilbert-sentiment:slim-v1
  # Your service URL, shown at the top of the service page in Render
  APP_URL: https://YOUR-SERVICE-NAME.onrender.com
  # Your service ID (srv-...), from the Render dashboard address bar
  DEPLOYS_API: https://api.render.com/v1/services/srv-YOUR-SERVICE-ID/deploys

jobs:
  # JOB 1 (CI): run the image and make a real prediction
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Start the container
        run: docker run -d -p 7860:7860 $IMAGE

      - name: Check health, the web page and a prediction
        run: |
          curl --retry 10 --retry-delay 5 --retry-all-errors -f http://localhost:7860/health
          curl -f http://localhost:7860/ | grep "<title>"
          curl -f -X POST http://localhost:7860/predict \
            -H "Content-Type: application/json" \
            -d '{"text": "I love GitHub Actions!"}'

  # JOB 2 (CD): runs only if the test job passed
  deploy:
    runs-on: ubuntu-latest
    needs: test
    env:
      AUTH: "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}"
    steps:
      - name: Ask Render to deploy the image we just tested
        id: start
        run: |
          DEPLOY_ID=$(curl -sf -X POST "$DEPLOYS_API" -H "$AUTH" \
            -H "Content-Type: application/json" \
            -d "{\"imageUrl\": \"$IMAGE\"}" | jq -r '.id')
          echo "Deploy started: $DEPLOY_ID"
          echo "deploy_id=$DEPLOY_ID" >> $GITHUB_OUTPUT

      - name: Wait until Render says the deploy is live
        run: |
          for i in $(seq 1 60); do
            STATUS=$(curl -sf "$DEPLOYS_API/${{ steps.start.outputs.deploy_id }}" -H "$AUTH" | jq -r '.status')
            echo "[$i] $STATUS"
            if [ "$STATUS" = "live" ]; then exit 0; fi
            if [[ "$STATUS" == *failed || "$STATUS" == "canceled" ]]; then exit 1; fi
            sleep 10
          done
          echo "Timed out waiting for Render"; exit 1

      - name: Check the live site (shows which version is running)
        run: curl --retry 5 --retry-delay 10 --retry-all-errors -f $APP_URL/health
