name: Deploy DistilBERT to Render

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (leave blank to use the default below)"
        required: false
        default: ""

env:
  DOCKER_REPO: 03sarath/distilbert-sentiment
  # Change this tag and push to main -> that version gets tested and deployed
  # 'slim' = ONNX int8 build from slim-image/ in this repo (fits in free 512MB).
  # 'latest'/'v1' are the ~3GB PyTorch builds that get OOM-killed on free.
  IMAGE_TAG: ${{ inputs.image_tag || 'slim' }}
  RENDER_SERVICE_NAME: distilbert-sentiment
  RENDER_REGION: oregon
  # free = 512MB RAM, no card needed. Check "Report memory used by the model"
  # in the smoke test: if it's near/over 512MB the container can be OOM-killed.
  # Paid plans (starter/standard) need a payment method on the Render workspace.
  # Free services also sleep after ~15 min idle; first request wakes them (slow).
  RENDER_PLAN: free
  APP_PORT: "7860"

jobs:

  # -------------------------------------------------
  # JOB 1: CI - pull the real image, run it,
  #        send a real prediction, confirm it works.
  #        Nothing reaches Render unless this passes.
  # -------------------------------------------------
  smoke-test:
    name: Model Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Start container
        run: docker run -d --name smoke-test -p 7860:7860 $DOCKER_REPO:$IMAGE_TAG

      - name: Wait for model and run smoke test
        run: |
          curl --retry 20 --retry-delay 15 --retry-connrefused --retry-all-errors -sf http://localhost:7860/health
          curl --fail -X POST http://localhost:7860/predict -H "Content-Type: application/json" -d '{"text": "The weather today is absolutely wonderful!"}'

      - name: Report memory used by the model
        run: |
          echo "Memory this model actually needs (compare against your Render plan):"
          docker stats --no-stream --format "{{.MemUsage}}" smoke-test

      - name: Stop container
        if: always()
        run: docker stop smoke-test && docker rm smoke-test

  # -------------------------------------------------
  # JOB 2: PROVISIONING - create the Render service
  #        only if it does not exist yet.
  #        Runs every push, but does real work ONCE.
  #        This is infrastructure, not delivery.
  # -------------------------------------------------
  provision:
    name: Provision Render Service
    runs-on: ubuntu-latest
    needs: smoke-test
    outputs:
      service_id: ${{ steps.ensure.outputs.service_id }}
      service_url: ${{ steps.ensure.outputs.service_url }}
      created: ${{ steps.ensure.outputs.created }}
    steps:
      - name: Create service if it does not exist
        id: ensure
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          API=https://api.render.com/v1
          AUTH="Authorization: Bearer $RENDER_API_KEY"

          # Call the Render API; on HTTP >= 400 print Render's own error message
          # (plain `curl -sf` hides it and just exits 22).
          # usage: render METHOD PATH [JSON_BODY]
          render() {
            local args=(-sS -o resp.json -w '%{http_code}' -X "$1" -H "$AUTH" -H "Accept: application/json")
            if [ -n "${3:-}" ]; then
              args+=(-H "Content-Type: application/json" -d "$3")
            fi
            local code
            code=$(curl "${args[@]}" "$API$2") || { echo "::error::Network error calling Render: $1 $2" >&2; return 1; }
            if [ "$code" -ge 400 ]; then
              echo "::error::Render API $1 $2 returned HTTP $code: $(cat resp.json)" >&2
              return 1
            fi
            cat resp.json
          }

          # Does a service with this name already exist?
          EXISTING=$(render GET "/services?name=$RENDER_SERVICE_NAME&type=web_service&limit=1")
          SERVICE_ID=$(echo "$EXISTING" | jq -r '.[0].service.id // empty')

          if [ -n "$SERVICE_ID" ]; then
            echo "Service already exists: $SERVICE_ID"
            SERVICE_URL=$(echo "$EXISTING" | jq -r '.[0].service.serviceDetails.url')
            CREATED=false

            # Desired state: the plan in this file wins. If someone changed the
            # instance type in the dashboard (or it was created on free), fix it.
            CURRENT_PLAN=$(echo "$EXISTING" | jq -r '.[0].service.serviceDetails.plan')
            if [ "$CURRENT_PLAN" != "$RENDER_PLAN" ]; then
              echo "Plan drift: service is on '$CURRENT_PLAN', workflow wants '$RENDER_PLAN'. Updating..."
              PATCH_BODY=$(jq -n --arg plan "$RENDER_PLAN" '{serviceDetails: {plan: $plan}}')
              if ! render PATCH "/services/$SERVICE_ID" "$PATCH_BODY" > /dev/null; then
                echo "::error::Could not change plan '$CURRENT_PLAN' -> '$RENDER_PLAN'. Moving off 'free' needs a payment method on the Render workspace (Dashboard -> Billing). Add one, or change the instance type once in the dashboard, then re-run."
                exit 1
              fi
              echo "Plan updated to '$RENDER_PLAN' (takes effect on the deploy below)."
            else
              echo "Plan is already '$RENDER_PLAN' - nothing to provision."
            fi
          else
            echo "No service found. Creating it..."
            OWNER_ID=$(render GET "/owners?limit=1" | jq -r '.[0].owner.id')

            CREATE_BODY=$(jq -n \
              --arg name    "$RENDER_SERVICE_NAME" \
              --arg owner   "$OWNER_ID" \
              --arg image   "docker.io/$DOCKER_REPO:$IMAGE_TAG" \
              --arg plan    "$RENDER_PLAN" \
              --arg region  "$RENDER_REGION" \
              --arg port    "$APP_PORT" \
              '{
                 type: "web_service",
                 name: $name,
                 ownerId: $owner,
                 image: { ownerId: $owner, imagePath: $image },
                 serviceDetails: {
                   runtime: "image",
                   plan: $plan,
                   region: $region,
                   healthCheckPath: "/health",
                   envSpecificDetails: {}
                 },
                 envVars: [ { key: "PORT", value: $port } ]
               }')

            CREATED_JSON=$(render POST "/services" "$CREATE_BODY")
            SERVICE_ID=$(echo "$CREATED_JSON" | jq -r '.service.id')
            SERVICE_URL=$(echo "$CREATED_JSON" | jq -r '.service.serviceDetails.url')
            CREATED=true
            echo "Created service: $SERVICE_ID (its first deploy has already started)"
          fi

          echo "service_id=$SERVICE_ID"   >> $GITHUB_OUTPUT
          echo "service_url=$SERVICE_URL" >> $GITHUB_OUTPUT
          echo "created=$CREATED"         >> $GITHUB_OUTPUT

  # -------------------------------------------------
  # JOB 3: CD - tell Render to run THIS exact tag,
  #        then WAIT for Render to say it is live.
  #        If the container crashes (OOM, bad port,
  #        broken model) this job goes red.
  # -------------------------------------------------
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: provision
    steps:
      - name: Trigger Render deploy
        id: trigger
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ needs.provision.outputs.service_id }}
          JUST_CREATED: ${{ needs.provision.outputs.created }}
        run: |
          API=https://api.render.com/v1
          AUTH="Authorization: Bearer $RENDER_API_KEY"

          if [ "$JUST_CREATED" = "true" ]; then
            # Creating the service already kicked off a deploy of this image,
            # so don't start a second one - just follow the existing deploy.
            echo "Service was just created; following its first deploy."
            DEPLOY_ID=$(curl -sf -H "$AUTH" "$API/services/$SERVICE_ID/deploys?limit=1" | jq -r '.[0].deploy.id')
          else
            BODY=$(jq -n --arg img "docker.io/$DOCKER_REPO:$IMAGE_TAG" '{imageUrl: $img}')
            RESP=$(curl -sf -X POST "$API/services/$SERVICE_ID/deploys" -H "$AUTH" -H "Content-Type: application/json" -d "$BODY")
            DEPLOY_ID=$(echo "$RESP" | jq -r '.id')
            echo "Deploy triggered: docker.io/$DOCKER_REPO:$IMAGE_TAG"
          fi

          echo "deploy_id=$DEPLOY_ID" >> $GITHUB_OUTPUT
          echo "Deploy id: $DEPLOY_ID"

      - name: Wait for Render to finish the deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ needs.provision.outputs.service_id }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          API=https://api.render.com/v1
          AUTH="Authorization: Bearer $RENDER_API_KEY"

          # Poll for up to 15 minutes (90 x 10s)
          for i in $(seq 1 90); do
            STATUS=$(curl -sf -H "$AUTH" "$API/services/$SERVICE_ID/deploys/$DEPLOY_ID" | jq -r '.status')
            echo "[$i] status: $STATUS"

            case "$STATUS" in
              live)
                echo "Render reports the deploy is LIVE."
                exit 0
                ;;
              build_failed|update_failed|canceled|pre_deploy_failed)
                echo "::error::Render deploy finished with status '$STATUS'."
                # Show WHY: Render's service events include e.g. server_failed with
                # an oomKilled (out of memory) or nonZeroExit reason.
                echo "Recent Render events for this service (newest first):"
                curl -s -H "$AUTH" "$API/services/$SERVICE_ID/events?limit=10" \
                  | jq -c '.[].event | {timestamp, type, details}' || true
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "::error::Timed out after 15 minutes waiting for the deploy to go live."
          exit 1

  # -------------------------------------------------
  # JOB 4: Confirm the new version answers publicly
  # -------------------------------------------------
  health-check:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: [provision, deploy]
    steps:
      - name: Call the public health endpoint
        env:
          SERVICE_URL: ${{ needs.provision.outputs.service_url }}
        run: |
          # Free instances can be slow to wake up, so allow ~3 minutes
          curl --fail --retry 12 --retry-delay 15 --retry-connrefused --retry-all-errors "$SERVICE_URL/health"
          echo ""
          echo "Live at $SERVICE_URL"
